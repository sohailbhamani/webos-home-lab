# Run before every commit:  pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      # Patches need their trailing spaces: a blank context line is a single space.
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: trailing-whitespace
        exclude: '\.patch$'
