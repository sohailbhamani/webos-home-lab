name: ci
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets, keys, firmware or LG QML committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)(stock-qml|.*-qml)/|\.(key|pem|ipk|epk|img|bin)$|_rsa($|\.)|webos_rsa|tv-host' || true)
          if [ -n "$bad" ]; then
            echo "::error::Disallowed files are tracked:"; echo "$bad"; exit 1
          fi
          echo "clean"
      - name: Shell scripts parse
        run: for f in $(git ls-files '*.sh' hooks/*); do sh -n "$f" && echo "ok $f"; done
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
