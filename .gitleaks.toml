# Minimal gitleaks config: default rules + repo-specific device/key patterns.
[extend]
useDefault = true

[[rules]]
id = "lg-webos-rsa-key"
description = "LG webOS dev-mode private key"
regex = '''-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "tv-host-address"
description = "Hard-coded LAN TV address with a user@ (keep device details out)"
regex = '''(root|prisoner)@(\d{1,3}\.){3}\d{1,3}'''
tags = ["device"]

[allowlist]
description = "Placeholders in docs, and this config's own pattern strings"
paths = ['''\.gitleaks\.toml$''', '''\.github/workflows/''', '''\.pre-commit-config\.yaml$''']
regexes = ['''root@<tv-ip>''']
